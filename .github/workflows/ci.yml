name: CI

on:
  push:
    branches: [collaborator]  # main is covered by deploy.yml (calls this workflow)
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholder values so the build does not fail on missing env vars.
      # Real values live only on the server (.env / ENV_FILE secret).
      MONGODB_URI: mongodb://127.0.0.1:27017/ci
      JWT_SECRET: ci-placeholder-secret
      JWT_EXPIRES_IN: 1d
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      SMTP_ENABLED: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
